<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Training Attendance Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      text-align: center; 
      background: #f4f6f9; 
      margin: 0; 
      padding: 20px; 
    }

    
    .container { 
      position: relative;
      max-width: 650px;                   
      margin: 20px auto; 
      background: white; 
      padding: 40px 30px;                
      border-radius: 16px; 
      box-shadow: 0 6px 20px rgba(0,0,0,0.08); 
      overflow: hidden;
      min-height: 520px;                  
    }

   
    .container::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;                         
      height: 90%;
      background-image: url('Commission_on_Audit.svg.webp');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.20;                      
      pointer-events: none;
      z-index: 0;
    }

    
    .container h2,
    .container p,
    #reader,
    #result-box {
      position: relative;
      z-index: 1;
    }

    h2 { color: #1a73e8; margin-top: 0; font-size: 1.6em; }
    
    #reader { width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
    
    #reader video {
      transform: rotateY(180deg) !important;
      -webkit-transform: rotateY(180deg) !important;
    }

    #result-box { margin-top: 20px; padding: 15px; border-radius: 6px; font-weight: bold; font-size: 1.1em; display: none; }
    .success { background: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
    .loading { background: #fef7e0; color: #b06000; border: 1px solid #feefc3; }
  </style>
</head>
<body>
  
<div class="container">
  <h2>Training Attendance Scanner</h2>
  <p>Place the participant's QR code in front of the webcam</p>
  <div id="reader"></div>
  <div id="result-box"></div>
</div>

<audio id="scan-sound" src="barcode sound effect.mp3" preload="auto"></audio>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const customScriptUrl = urlParams.get('scriptUrl');

  const defaultWebAppUrl = "https://script.google.com/macros/s/AKfycbyCprd2xbGdpQ7zM2ueI-FTJ0ZpQumiEDCaOW0rSja7M4hj3GVmMdNLwBdItIr9o6rxOA/exec";
  const googleWebAppUrl = customScriptUrl ? decodeURIComponent(customScriptUrl) : defaultWebAppUrl;

  window.addEventListener('DOMContentLoaded', () => {
    fetch(googleWebAppUrl, { redirect: "follow" })
      .then(response => response.json())
      .then(data => {
        if (data.title && data.title !== "") {
          document.title = data.title;
        }
      })
      .catch(err => {
        console.error("Could not fetch sheet title:", err);
        document.title = "Seminar Attendance Scanner";
      });
  });

  let lastScannedCode = "";
  let isProcessing = false;

  function onScanSuccess(decodedText) {
    if (isProcessing || decodedText === lastScannedCode) return;
    
    isProcessing = true;
    lastScannedCode = decodedText;
    
    try {
      const sound = document.getElementById('scan-sound');
      if (sound) {
        sound.currentTime = 0;
        sound.play();
      }
    } catch(err) {
      console.log("Audio playback blocked by browser settings until user interacts with page.");
    }
    
    const resultBox = document.getElementById("result-box");
    resultBox.className = "loading";
    resultBox.style.display = "block";
    resultBox.style.background = "#fef7e0";
    resultBox.style.color = "#b06000";
    resultBox.innerText = "Processing scan... Please hold.";

    let scannedId = decodedText;
    if (decodedText.includes("id=")) {
      scannedId = decodedText.split("id=")[1];
      if (scannedId.includes("&")) {
        scannedId = scannedId.split("&")[0];
      }
    }
    scannedId = scannedId.trim();

    fetch(googleWebAppUrl, {
      method: "POST",
      body: JSON.stringify({ id: scannedId }),
      headers: { "Content-Type": "text/plain" }
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === "success") {
        resultBox.className = "success";
        resultBox.style.background = "#e6f4ea";
        resultBox.style.color = "#137333";
        resultBox.innerText = data.message;
      } else {
        resultBox.className = "loading";
        resultBox.style.background = "#fce8e6";
        resultBox.style.color = "#c5221f";
        resultBox.innerText = "Error: " + data.message;
      }
      
      setTimeout(() => {
        isProcessing = false;
        lastScannedCode = "";
        resultBox.style.display = "none";
      }, 6000);
    })
    .catch(err => {
      console.error(err);
      resultBox.className = "loading";
      resultBox.style.background = "#fce8e6";
      resultBox.style.color = "#c5221f";
      resultBox.innerText = "Network Error: Could not reach Google Sheet.";
      
      setTimeout(() => {
        isProcessing = false;
        lastScannedCode = "";
        resultBox.style.display = "none";
      }, 6000);
    });
  }

  const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
    fps: 10, 
    qrbox: { width: 250, height: 250 },
    formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ]
  });
  html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
