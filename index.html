<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Attendance Scanner</title>

  <!-- 1. BOOTSTRAP 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- 2. HTML5-QRCode Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style>
    /* Custom styles for the COA Logo Watermark and Camera Box */
    .scanner-card {
      position: relative;
      overflow: hidden;
      max-width: 650px; /* Upper limit on wide screens */
    }

    /* 🏛️ COA LOGO BACKGROUND WATERMARK */
    .scanner-card::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 80%;
      background-image: url('Commission_on_Audit.svg.webp');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }

    /* Keep card elements layered above the watermark */
    .scanner-card .card-body {
      position: relative;
      z-index: 1;
    }

    /* 📷 CAMERA VIEWPORT */
    #reader {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    #reader video {
      transform: rotateY(180deg) !important;
      -webkit-transform: rotateY(180deg) !important;
    }
  </style>
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-center align-items-center py-4">

<!-- Main Bootstrap Container -->
<div class="container d-flex justify-content-center">
  <div class="card scanner-card shadow-sm border-0 w-100 p-3 p-md-4">
    <div class="card-body text-center">
      
      <!-- Title & Subtitle -->
      <h2 class="text-primary fw-bold mb-2">Training Attendance Scanner</h2>
      <p class="text-muted lead mb-4 fs-6">Place the participant's QR code in front of the webcam</p>

      <!-- Camera Scanner Viewport -->
      <div id="reader" class="shadow-sm mb-3"></div>

      <!-- Result Alert Box -->
      <div id="result-box" class="alert fw-bold text-center mx-auto" style="display: none; max-width: 420px;" role="alert"></div>

    </div>
  </div>
</div>

<audio id="scan-sound" src="barcode sound effect.mp3" preload="auto"></audio>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const customScriptUrl = urlParams.get('scriptUrl');

  const defaultWebAppUrl = "YOUR_APPS_SCRIPT_EXEC_URL_HERE";
  const googleWebAppUrl = customScriptUrl ? decodeURIComponent(customScriptUrl) : defaultWebAppUrl;

  window.addEventListener('DOMContentLoaded', () => {
    fetch(googleWebAppUrl, { redirect: "follow" })
      .then(response => response.json())
      .then(data => {
        if (data.title && data.title !== "") {
          document.title = data.title;
        }
      })
      .catch(err => {
        console.error("Could not fetch sheet title:", err);
        document.title = "Seminar Attendance Scanner";
      });
  });

  let lastScannedCode = "";
  let isProcessing = false;

  function onScanSuccess(decodedText) {
    if (isProcessing || decodedText === lastScannedCode) return;
    
    isProcessing = true;
    lastScannedCode = decodedText;
    
    try {
      const sound = document.getElementById('scan-sound');
      if (sound) {
        sound.currentTime = 0;
        sound.play();
      }
    } catch(err) {
      console.log("Audio playback blocked by browser settings until user interacts with page.");
    }
    
    const resultBox = document.getElementById("result-box");
    
    // Bootstrap warning alert while processing
    resultBox.className = "alert alert-warning fw-bold text-center mx-auto my-3";
    resultBox.style.display = "block";
    resultBox.innerText = "Processing scan... Please hold.";

    let scannedId = decodedText;
    if (decodedText.includes("id=")) {
      scannedId = decodedText.split("id=")[1];
      if (scannedId.includes("&")) {
        scannedId = scannedId.split("&")[0];
      }
    }
    scannedId = scannedId.trim();

    fetch(googleWebAppUrl, {
      method: "POST",
      body: JSON.stringify({ id: scannedId }),
      headers: { "Content-Type": "text/plain" }
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === "success") {
        // Bootstrap success alert
        resultBox.className = "alert alert-success fw-bold text-center mx-auto my-3";
        resultBox.innerText = data.message;
      } else {
        // Bootstrap danger/error alert
        resultBox.className = "alert alert-danger fw-bold text-center mx-auto my-3";
        resultBox.innerText = "Error: " + data.message;
      }
      
      setTimeout(() => {
        isProcessing = false;
        lastScannedCode = "";
        resultBox.style.display = "none";
      }, 6000);
    })
    .catch(err => {
      console.error(err);
      resultBox.className = "alert alert-danger fw-bold text-center mx-auto my-3";
      resultBox.innerText = "Network Error: Could not reach Google Sheet.";
      
      setTimeout(() => {
        isProcessing = false;
        lastScannedCode = "";
        resultBox.style.display = "none";
      }, 6000);
    });
  }

  const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
    fps: 10, 
    qrbox: { width: 250, height: 250 },
    formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ]
  });
  html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
