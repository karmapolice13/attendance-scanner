<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seminar Attendance Scanner</title>

  <!-- 1. BOOTSTRAP 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- 2. CUSTOM CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- 3. HTML5-QRCode Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-center py-4">

<!-- 1. TOP MAIN HEADER: Dynamic Seminar Title -->
<header class="text-center mb-4">
  <div class="container">
    <h1 id="event-title" class="fw-bold text-primary display-6 px-3 py-2 bg-white rounded-3 shadow-sm d-inline-block border">
      Loading Seminar Details...
    </h1>
  </div>
</header>

<!-- 2. MAIN TWO-COLUMN CONTAINER -->
<div class="container-fluid px-md-4 max-w-xl">
  <div class="card scanner-card shadow-sm border-0 w-100 p-3 p-md-4">
    <div class="card-body p-2 p-md-3">
      
      <div class="row g-4 align-items-center">
        
        <!-- LEFT COLUMN: Participant Results Display -->
        <div class="col-12 col-md-5 d-flex flex-column justify-content-center text-center border-end-md">
          <h4 class="fw-bold text-secondary mb-3">Attendance Status</h4>
          
          <!-- Idle / Default State Message -->
          <div id="idle-notice" class="text-muted p-4 border rounded-3 bg-light">
            <p class="mb-0 fs-5">Awaiting QR scan...</p>
            <small>Participant information will be displayed here upon scanning.</small>
          </div>

          <!-- Result Alert Box (Shows participant name / status) -->
          <div id="result-box" class="alert fw-bold text-center w-100 my-2 shadow-sm" role="alert" style="display: none;"></div>
        </div>

        <!-- RIGHT COLUMN: Scanner, Logo Banner, Clock & Instructions -->
        <div class="col-12 col-md-7 text-center">
          
          <!-- Banner Logo Header -->
          <div class="mb-3">
            <img 
              src="assets/logos/darklogo.png" 
              alt="Seminar Attendance Scanner Header" 
              class="img-fluid header-logo"
            >
          </div>

          <!-- Digital Clock & Date -->
          <div class="text-center mb-3">
            <div id="digital-clock" class="digital-clock">00:00:00 AM</div>
            <div id="digital-date" class="digital-date mt-2">Loading date...</div>
          </div>

          <!-- Instruction Subtitle -->
          <p class="scanner-instruction text-muted lead mb-3 fs-6">
            Place the participant's QR code in front of the webcam
          </p>

          <!-- Camera Viewport -->
          <div id="reader" class="shadow-sm mx-auto"></div>

        </div>

      </div> <!-- /row -->

    </div>
  </div>
</div>

<audio id="scan-sound" src="assets/sounds/barcode_sound_effect_1.mp3" preload="auto"></audio>
<audio id="error-sound" src="assets/sounds/error_sound_effect.mp3" preload="auto"></audio>

<!-- JavaScript Script Block -->
<script>
  // ====================================================
  // 1. CLOCK & DATE LOGIC
  // ====================================================
  function updateClockAndDate() {
    const clockElement = document.getElementById('digital-clock');
    const dateElement = document.getElementById('digital-date');
    const now = new Date();

    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';

    hours = hours % 12;
    hours = hours ? hours : 12;
    const formattedHours = String(hours).padStart(2, '0');

    if (clockElement) {
      clockElement.innerText = `${formattedHours}:${minutes}:${seconds} ${ampm}`;
    }

    if (dateElement) {
      const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      dateElement.innerText = now.toLocaleDateString('en-US', dateOptions);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateClockAndDate();
    setInterval(updateClockAndDate, 1000);
  });

 // ====================================================
  // 2. DYNAMIC TITLE FETCH (WITH CACHE-BUSTING)
  // ====================================================
  const urlParams = new URLSearchParams(window.location.search);
  const customScriptUrl = urlParams.get('scriptUrl');
  const defaultWebAppUrl = "https://script.google.com/macros/s/AKfycbyCprd2xbGdpQ7zM2ueI-FTJ0ZpQumiEDCaOW0rSja7M4hj3GVmMdNLwBdItIr9o6rxOA/exec";
  
  let googleWebAppUrl = customScriptUrl ? decodeURIComponent(customScriptUrl) : defaultWebAppUrl;

  document.addEventListener('DOMContentLoaded', () => {
    const eventTitleElement = document.getElementById('event-title');

    // Append timestamp to prevent browser/CDN caching
    const cacheBuster = (googleWebAppUrl.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
    const fetchUrl = googleWebAppUrl + cacheBuster;

    fetch(fetchUrl, { redirect: "follow" })
      .then(response => response.json())
      .then(data => {
        if (data.title && data.title !== "") {
          if (eventTitleElement) eventTitleElement.innerText = data.title;
          document.title = data.title;
        } else {
          if (eventTitleElement) eventTitleElement.innerText = "Seminar Attendance Scanner";
        }
      })
      .catch(err => {
        console.error("Could not fetch sheet title:", err);
        if (eventTitleElement) eventTitleElement.innerText = "Seminar Attendance Scanner";
      });
  });
  
  // ====================================================
  // 3. AUDIO HANDLERS
  // ====================================================
  function playSuccessSound() {
    try {
      const sound = document.getElementById('scan-sound');
      if (sound) { sound.currentTime = 0; sound.play(); }
    } catch(err) { console.log("Audio playback blocked."); }
  }

  function playErrorSound() {
    try {
      const sound = document.getElementById('error-sound');
      if (sound) { sound.currentTime = 0; sound.play(); }
    } catch(err) { console.log("Audio playback blocked."); }
  }

  // ====================================================
  // 4. SCANNER LOGIC
  // ====================================================
  let lastScannedCode = "";
  let isProcessing = false;

  function onScanSuccess(decodedText) {
    if (isProcessing || decodedText === lastScannedCode) return;
    
    isProcessing = true;
    lastScannedCode = decodedText;
    
    const resultBox = document.getElementById("result-box");
    const idleNotice = document.getElementById("idle-notice");

    if (idleNotice) idleNotice.style.display = "none";
    
    resultBox.className = "alert alert-warning fw-bold text-center w-100 my-2 shadow-sm fs-5";
    resultBox.style.display = "block";
    resultBox.innerText = "Processing scan... Please hold.";

    let scannedId = decodedText;
    if (decodedText.includes("id=")) {
      scannedId = decodedText.split("id=")[1];
      if (scannedId.includes("&")) scannedId = scannedId.split("&")[0];
    }
    scannedId = scannedId.trim();

    fetch(googleWebAppUrl, {
      method: "POST",
      body: JSON.stringify({ id: scannedId }),
      headers: { "Content-Type": "text/plain" }
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === "success") {
        playSuccessSound();
        resultBox.className = "alert alert-success fw-bold text-center w-100 my-2 p-3 shadow-sm fs-5";
        resultBox.innerText = data.message;
      } else {
        playErrorSound();
        resultBox.className = "alert alert-danger fw-bold text-center w-100 my-2 p-3 shadow-sm fs-5";
        resultBox.innerText = "Error: " + data.message;
      }
      
      setTimeout(() => {
        isProcessing = false;
        lastScannedCode = "";
        resultBox.style.display = "none";
        if (idleNotice) idleNotice.style.display = "block";
      }, 6000);
    })
    .catch(err => {
      console.error(err);
      playErrorSound();
      resultBox.className = "alert alert-danger fw-bold text-center w-100 my-2 p-3 shadow-sm fs-5";
      resultBox.innerText = "Network Error: Could not reach Google Sheet.";
      
      setTimeout(() => {
        isProcessing = false;
        lastScannedCode = "";
        resultBox.style.display = "none";
        if (idleNotice) idleNotice.style.display = "block";
      }, 6000);
    });
  }

  const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
    fps: 10, 
    qrbox: { width: 250, height: 250 },
    formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ]
  });
  html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
