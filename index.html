<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seminar Attendance Scanner</title>

  <!-- 1. BOOTSTRAP 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- 2. CUSTOM CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- 3. HTML5-QRCode Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
  
<body class="custom-bg min-vh-100 d-flex flex-column justify-content-center align-items-center py-4">
  
<div class="container d-flex justify-content-center">
<div class="card scanner-card shadow-sm border-0 w-100 p-3 p-md-4">
<div class="card-body text-center">
      
<!-- Banner Logo Header -->
<div class="mb-3 text-center">
  <img 
    src="assets/logos/whitelogo.png.png" 
    alt="Seminar Attendance Scanner Header" 
    class="img-fluid header-logo"
  >
</div>

<!-- Digital Clock & Date Container -->
<div class="text-center mb-3">
  <div id="digital-clock" class="digital-clock">00:00:00 AM</div>
  <!-- Date Display -->
  <div id="digital-date" class="digital-date mt-2">Loading date...</div>
</div>

<!-- Instruction Subtitle -->
<p class="scanner-instruction text-muted lead mb-4 fs-6">Place the participant's QR code in front of the webcam</p>
  
<!-- Instruction Subtitle -->
<p class="text-white lead mb-4 fs-6">Place the participant's QR code in front of the camera</p>

      <!-- Camera Viewport -->
      <div id="reader" class="shadow-sm mb-3"></div>

      <!-- Result Alert Box -->
      <div id="result-box" class="alert fw-bold text-center mx-auto" role="alert"></div>

    </div>
  </div>
</div>

<audio id="scan-sound" src="assets/sounds/storescannerbeep.mp3" preload="auto"></audio>
<audio id="error-sound" src="assets/sounds/errorsound.wav" preload="auto"></audio>

<script>
  // ====================================================
  // 1. BULLETPROOF CLOCK & DATE LOGIC
  // ====================================================
  function updateClockAndDate() {
    const clockElement = document.getElementById('digital-clock');
    const dateElement = document.getElementById('digital-date');

    const now = new Date();

    // 12-Hour Time Format
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';

    hours = hours % 12;
    hours = hours ? hours : 12; // Convert 0 to 12
    const formattedHours = String(hours).padStart(2, '0');

    if (clockElement) {
      clockElement.innerText = `${formattedHours}:${minutes}:${seconds} ${ampm}`;
    }

    // Date Format (e.g., Tuesday, August 25, 2026)
    if (dateElement) {
      const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      dateElement.innerText = now.toLocaleDateString('en-US', dateOptions);
    }
  }

  // Run timer immediately once the DOM is fully loaded
  document.addEventListener('DOMContentLoaded', () => {
    updateClockAndDate(); // Run 1st tick immediately
    setInterval(updateClockAndDate, 1000); // Tick every 1 second
  });

  // ====================================================
  // 2. SEMINAR TITLE FETCHING
  // ====================================================
  const urlParams = new URLSearchParams(window.location.search);
  const customScriptUrl = urlParams.get('scriptUrl');
  const defaultWebAppUrl = "YOUR_APPS_SCRIPT_EXEC_URL_HERE";
  const googleWebAppUrl = customScriptUrl ? decodeURIComponent(customScriptUrl) : defaultWebAppUrl;

  document.addEventListener('DOMContentLoaded', () => {
    const eventTitleElement = document.getElementById('event-title');
    fetch(googleWebAppUrl, { redirect: "follow" })
      .then(response => response.json())
      .then(data => {
        if (data.title && data.title !== "") {
          if (eventTitleElement) eventTitleElement.innerText = data.title;
          document.title = data.title;
        } else {
          if (eventTitleElement) eventTitleElement.innerText = "Seminar Attendance Scanner";
        }
      })
      .catch(err => {
        console.error("Could not fetch sheet title:", err);
        if (eventTitleElement) eventTitleElement.innerText = "Seminar Attendance Scanner";
      });
  });

  // ====================================================
  // 3. AUDIO HANDLERS
  // ====================================================
  function playSuccessSound() {
    try {
      const sound = document.getElementById('scan-sound');
      if (sound) { sound.currentTime = 0; sound.play(); }
    } catch(err) { console.log("Audio blocked until interaction."); }
  }

  function playErrorSound() {
    try {
      const sound = document.getElementById('error-sound');
      if (sound) { sound.currentTime = 0; sound.play(); }
    } catch(err) { console.log("Audio blocked until interaction."); }
  }

  // ====================================================
  // 4. QR SCANNER LOGIC
  // ====================================================
  let lastScannedCode = "";
  let isProcessing = false;

  function onScanSuccess(decodedText) {
    if (isProcessing || decodedText === lastScannedCode) return;
    
    isProcessing = true;
    lastScannedCode = decodedText;
    
    const resultBox = document.getElementById("result-box");
    resultBox.className = "alert alert-warning fw-bold text-center w-100 my-2 shadow-sm";
    resultBox.style.display = "block";
    resultBox.innerText = "Processing scan... Please hold.";

    let scannedId = decodedText;
    if (decodedText.includes("id=")) {
      scannedId = decodedText.split("id=")[1];
      if (scannedId.includes("&")) scannedId = scannedId.split("&")[0];
    }
    scannedId = scannedId.trim();

    fetch(googleWebAppUrl, {
      method: "POST",
      body: JSON.stringify({ id: scannedId }),
      headers: { "Content-Type": "text/plain" }
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === "success") {
        playSuccessSound();
        resultBox.className = "alert alert-success fw-bold text-center w-100 my-2 shadow-sm";
        resultBox.innerText = data.message;
      } else {
        playErrorSound();
        resultBox.className = "alert alert-danger fw-bold text-center w-100 my-2 shadow-sm";
        resultBox.innerText = "Error: " + data.message;
      }
      
      setTimeout(() => {
        isProcessing = false;
        lastScannedCode = "";
        resultBox.style.display = "none";
      }, 6000);
    })
    .catch(err => {
      console.error(err);
      playErrorSound();
      resultBox.className = "alert alert-danger fw-bold text-center w-100 my-2 shadow-sm";
      resultBox.innerText = "Network Error: Could not reach Google Sheet.";
      
      setTimeout(() => {
        isProcessing = false;
        lastScannedCode = "";
        resultBox.style.display = "none";
      }, 6000);
    });
  }

  // Render camera
  const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
    fps: 10, 
    qrbox: { width: 250, height: 250 },
    formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ]
  });
  html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
